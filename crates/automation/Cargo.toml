[package]
name = "filmcraft-automation"
description = "MCP server (rmcp) over the FilmCraft engine, plus a bridge to the running app's control channel"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lints]
workspace = true

[dependencies]
filmcraft-engine = { workspace = true }
filmcraft-time = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
rmcp = { version = "3.5", default-features = false, features = ["server", "macros", "transport-io"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "sync", "net", "io-util", "time"] }
base64 = "0.22"
schemars = "1"
image = { version = "0.25", default-features = false, features = ["png"] }
# Online libraries (Openverse audio, Google Fonts): pure-Rust TLS, OS certificate verification,
# the same stack as the speech-model downloads.
ureq = { version = "3", default-features = false, features = ["rustls-no-provider", "platform-verifier"] }
rustls-rustcrypto = "0.0.2-alpha"
# Kenney's CC0 sound packs come as zip archives: deflate only (pure Rust zlib-rs backend).
zip = { version = "7", default-features = false, features = ["deflate-flate2-zlib-rs"] }
